# The network's intended state: the single source of truth.
#
# `netrepair render` turns this into each router's FRR configuration and the
# containerlab topology; the controller compares the live network against it
# and repairs drift. Change the network here, not on the routers.
#
#           ┌──── p1 ────┐                 provider core, AS 65000:
#   ce1 ────┤     │      ├──── p3 ──── ce2   IS-IS level 2 + iBGP full mesh
#  (AS 65001)└──── p2 ───┘            (AS 65002)
#    │                                  │
#    a1  (OSPF: area 0 to ce1,          h2
#    │    area 1 on the LAN)
#    h1
#
# Site A (ce1) is dual-homed: p1 is the primary uplink (local-pref 200 in, no
# prepend out), p2 the backup (local-pref 100, AS path prepended 2x).

image: quay.io/frrouting/frr:9.1.0
host_image: nicolaka/netshoot:v0.13

timers:
  isis_hello: 1        # seconds; IS-IS hold time = hello x multiplier
  isis_multiplier: 3
  # FRR waits up to 30 s between regenerations of a router's link-state packet
  # by default, so a drain (metric change) or a failed link could take that long
  # to reach the other routers. 1 s keeps reaction time in line with the hellos.
  isis_lsp_gen_interval: 1
  isis_spf_interval: 1
  ospf_hello: 1
  ospf_dead: 4
  bgp_keepalive: 3
  bgp_hold: 9

routers:
  p1:
    asn: 65000
    loopback: 10.255.0.1
    isis_net: 49.0001.0000.0000.0001.00
  p2:
    asn: 65000
    loopback: 10.255.0.2
    isis_net: 49.0001.0000.0000.0002.00
  p3:
    asn: 65000
    loopback: 10.255.0.3
    isis_net: 49.0001.0000.0000.0003.00
  ce1:
    asn: 65001
    loopback: 10.255.1.1
    # Hand the other site's routes (learned over BGP) to a1 as specific OSPF
    # externals. A default route wouldn't do: in containerlab every node already
    # has a default route via its management interface, and that one would win.
    ospf_redistribute_bgp: true
    bgp_networks: [192.168.1.0/24]
  a1:
    loopback: 10.255.1.2
    lan: {iface: eth2, address: 192.168.1.1/24, ospf_area: 1}   # a1 is the area 0/1 ABR
  ce2:
    asn: 65002
    loopback: 10.255.2.1
    lan: {iface: eth2, address: 192.168.2.1/24}
    bgp_networks: [192.168.2.0/24]

# Point-to-point links. `a`/`b` are "node:interface"; addresses are a /31 pair.
links:
  - {a: "p1:eth1", b: "p2:eth1", net: 10.0.12.0/31, proto: isis, metric: 10}
  - {a: "p2:eth2", b: "p3:eth1", net: 10.0.23.0/31, proto: isis, metric: 10}
  - {a: "p1:eth2", b: "p3:eth2", net: 10.0.13.0/31, proto: isis, metric: 10}
  - {a: "p1:eth3", b: "ce1:eth1", net: 10.1.1.0/31, proto: ebgp, role: primary}
  - {a: "p2:eth3", b: "ce1:eth2", net: 10.1.2.0/31, proto: ebgp, role: backup}
  - {a: "ce1:eth3", b: "a1:eth1", net: 10.10.0.0/31, proto: ospf, ospf_area: 0}
  - {a: "p3:eth3", b: "ce2:eth1", net: 10.2.3.0/31, proto: ebgp, role: primary}

hosts:
  h1: {router: "a1:eth2", address: 192.168.1.10/24, gateway: 192.168.1.1}
  h2: {router: "ce2:eth2", address: 192.168.2.10/24, gateway: 192.168.2.1}

# What the controller may do on its own.
policy:
  drain_metric: 1000          # IS-IS metric that moves traffic off a link
  gray_loss_threshold: 0.05   # a link losing more than 5% of probes is unhealthy...
  gray_consecutive: 2         # ...in this many probe rounds in a row
  max_drained_links: 1        # never drain more than one core link at a time
  cooldown_seconds: 30        # after acting on a link, leave it alone this long
